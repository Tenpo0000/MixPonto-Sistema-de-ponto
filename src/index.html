<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="mixponto-contas-api" content="" />
        <title>Sistema de Ponto</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <section id="sessao-carregando" class="auth-tela" role="status" aria-live="polite">
            <div class="auth-cartao">
                <h1>Sistema de Ponto</h1>
                <p id="sessao-carregando-texto">Restaurando sua sessão…</p>
            </div>
        </section>
        <section id="auth-tela" class="auth-tela" hidden>
            <div class="auth-cartao">
                <h1>Sistema de Ponto</h1>
                <h2 id="auth-titulo">Entre na sua conta</h2>
                <p class="auth-descricao">Acesse os dados da sua empresa.</p>
                <form id="auth-form">
                    <fieldset>
                        <div id="auth-cadastro" hidden>
                            <label>
                                Seu nome
                                <input id="auth-nome" autocomplete="name" maxlength="160" />
                            </label>
                        </div>
                        <label>
                            E-mail
                            <input
                                id="auth-email"
                                type="email"
                                autocomplete="username"
                                required
                                maxlength="254"
                            />
                        </label>
                        <label>
                            Senha
                            <input
                                id="auth-senha"
                                type="password"
                                autocomplete="current-password"
                                required
                            />
                        </label>
                        <label class="auth-lembrar">
                            <input type="checkbox" id="auth-lembrar" />
                            Manter conectado neste navegador
                        </label>
                        <button id="auth-submit" type="submit" class="btn btn-primario">
                            Entrar
                        </button>
                    </fieldset>
                </form>
                <p id="auth-mensagem" role="status" aria-live="polite">Preparando acesso seguro…</p>
                <div id="auth-compartilhado" hidden>
                    <div id="auth-contas-lista"></div>
                    <button type="button" class="btn btn-primario" id="auth-verificar-email">Enviar confirmação de e-mail</button>
                    <button type="button" class="btn btn-secundario" id="auth-conferir-contas">Verificar meus acessos</button>
                    <button type="button" class="mov-link" id="auth-sair">Sair desta conta</button>
                </div>
                <button type="button" class="mov-link" id="auth-recuperar">
                    Esqueci minha senha
                </button>
                <button type="button" class="mov-link" id="auth-alternar">
                    Criar meu login
                </button>
                <button type="button" class="btn btn-secundario" id="auth-recarregar" hidden>
                    Recarregar Página
                </button>
            </div>
        </section>
        <div class="container" id="app-shell" hidden>
            <aside class="sidebar">
                <div class="logo"><h2>Sistema de ponto</h2></div>
                <nav class="menu" aria-label="Navegação principal">
                    <button class="menu-item" data-view="inicio"></button>
                    <div class="menu-grupo">
                        <button
                            class="menu-item"
                            data-view="cadastro"
                            aria-expanded="false"
                            aria-controls="submenu-cadastro"
                        ></button>
                        <div class="submenu" id="submenu-cadastro" hidden>
                            <button class="submenu-item" data-view="empresa">Empresa</button>
                            <button class="submenu-item" data-view="horario">Horário</button>
                            <button class="submenu-item" data-view="cadastro">Funcionário</button>
                            <button class="submenu-item" data-view="cargo">Cargo</button>
                            <button class="submenu-item" data-view="departamento">
                                Departamento
                            </button>
                            <button class="submenu-item" data-view="feriado">Feriado</button>
                            <button class="submenu-item" data-view="justificativa">
                                Justificativa
                            </button>
                        </div>
                    </div>
                    <div class="menu-grupo">
                        <button
                            class="menu-item"
                            data-view="movimentacoes"
                            aria-expanded="false"
                            aria-controls="submenu-movimentacoes"
                        ></button>
                        <div class="submenu" id="submenu-movimentacoes" hidden>
                            <button class="submenu-item" data-view="movimentacoes">
                                Cartão ponto
                            </button>
                            <button class="submenu-item" data-view="relatorio">
                                Relatório de cálculos
                            </button>
                            <button class="submenu-item" data-view="demitidos">
                                Funcionários demitidos
                            </button>
                        </div>
                    </div>
                    <div class="menu-grupo">
                        <button
                            class="menu-item"
                            data-view="configuracoes"
                            aria-expanded="false"
                            aria-controls="submenu-configuracoes"
                        ></button>
                        <div class="submenu" id="submenu-configuracoes" hidden>
                            <button class="submenu-item" data-view="usuarios">Usuários</button>
                            <button class="submenu-item" data-view="gerenciamento">
                                Gerenciamento
                            </button>
                        </div>
                    </div>
                </nav>
                <button class="btn-sobre" id="btn-sobre"></button>
            </aside>
            <main class="conteudo">
                <header class="topo">
                    <label class="busca-wrap">
                        <span id="icone-busca" aria-hidden="true"></span>
                        <input
                            type="text"
                            class="busca"
                            id="busca"
                            placeholder="Pesquisar"
                            aria-label="Pesquisar"
                        />
                    </label>
                    <div class="info-usuario">
                        <span id="sessao-email" class="sessao-email"></span>
                        <select id="sessao-conta" aria-label="Empresa em uso"></select>
                        <span class="sessao-empresa-id">ID da conta para o app: <code id="sessao-id-conta"></code></span>
                        <button type="button" class="btn btn-secundario btn-sair" id="btn-sair">
                            Sair
                        </button>
                        <button class="notificacoes" id="sino" aria-label="Notificações"></button>
                        <div class="usuario">
                            <span>Joãozinho do RH</span>
                            <small>ADMINISTRADOR</small>
                        </div>
                        <div class="avatar" aria-hidden="true">JR</div>
                    </div>
                </header>
                <section class="area-trabalho" id="view"></section>
            </main>
        </div>
        <script type="module">
            try {
                const { iniciar } = await import('./bootstrap.js');
                await iniciar();
            } catch (error) {
                console.error('Falha ao iniciar:', error);
                document.getElementById('sessao-carregando').hidden = true;
                document.getElementById('auth-tela').hidden = false;
                const mensagem = document.getElementById('auth-mensagem');
                mensagem.classList.add('auth-erro');
                mensagem.textContent =
                    'Não foi possível carregar o acesso. Confira a conexão e os arquivos do projeto. Detalhe: ' +
                    String(error.message || error);
                document.getElementById('auth-form').hidden = true;
                document.getElementById('auth-alternar').hidden = true;
                document.getElementById('auth-recuperar').hidden = true;
                const reload = document.getElementById('auth-recarregar');
                reload.hidden = false;
                reload.onclick = () => location.reload();
            }
        </script>
    </body>
</html>
